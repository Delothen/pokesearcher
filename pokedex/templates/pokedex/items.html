{% extends "base.html" %}
{% block title %}Items · PokéSearcher{% endblock %}
{% block content %}
<h1>Search an Item</h1>
<div class="search-wrapper">
  <form class="search-form"
        action="{% url 'pokedex:items' %}"
        id="items-search-form"
        hx-get="{% url 'pokedex:items' %}" hx-push-url="true"
        hx-trigger="submit"
        hx-target="#results"
        hx-swap="innerHTML">
    <input type="text" name="q"
           id="items-search"
           value="{{ q }}"
           placeholder="Type a battle item name…"
           autocomplete="off" required>
    <button type="submit">Search</button>
  </form>
  <div id="suggestions" class="suggestions"></div>
</div>
{% include "pokedex/_last_search.html" %}
<div id="results">
  {% if item or not_found or not_battle %}
    {% include "pokedex/items_result.html" %}
  {% endif %}
</div>
<script>
(function() {
  var allI = [];
  var inp =
    document.getElementById('items-search');
  var sug = document.getElementById('suggestions');
  var activeIdx = -1;

  // Filter bar (Type, Generation...) above the search box; it narrows the
  // suggestions below. Typing a name and pressing Search still searches it.
  var F = pksFilters.attach({
    kind: 'item',
    before: inp.closest('.search-wrapper'),
    onChange: function() { render(inp.value.trim()); },
    onLoad: function() {
      if (document.activeElement === inp) render(inp.value.trim());
    }
  });
  function showEmpty() {
    if (F.active()) {
      sug.style.display = 'block';
      sug.appendChild(F.emptyNote());
    } else {
      sug.style.display = 'none';
    }
  }

  // Every battle item (A to Z), loaded from our cached list.
  fetch('/api/item-list/')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      allI = d.slice().sort(function(a, b) { return a.localeCompare(b); });
      // clicked into the empty bar before the list arrived: show it now
      if (document.activeElement === inp && !inp.value.trim()) render('');
    });

  function score(name, q) {
    return pksScore(name, q);
  }

  function render(q) {
    sug.innerHTML = '';
    activeIdx = -1;
    var src = F.apply(allI);
    var matches;
    if (!q) {
      matches = src;
    } else {
      matches = src
        .map(function(m) {
          return { n: m, s: score(m, q) };
        })
        .filter(function(x) { return x.s > 0; })
        .sort(function(a, b) { return b.s - a.s; })
        .map(function(x) { return x.n; });
    }
    if (matches.length === 0) {
      showEmpty();
      return;
    }
    sug.style.display = 'block';
    matches.slice(0, 3).forEach(function(m) {
      sug.appendChild(makeText(m));
    });
    var rest = matches.slice(3);
    if (rest.length > 0) {
      var more = document.createElement('div');
      more.className = 'suggestions-more';
      rest.forEach(function(m) {
        more.appendChild(makeText(m));
      });
      sug.appendChild(more);
    }
  }

  function makeText(m) {
    var div = document.createElement('div');
    div.className = 'suggestion-item';
    // the item's sprite beside its name (Z-Crystals' art is filed as --held)
    var img = document.createElement('img');
    var base = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/';
    img.src = base + m + '.png';
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function() {
      if (!img.dataset.held) {
        img.dataset.held = '1';
        img.src = base + m + '--held.png';
      } else {
        img.style.visibility = 'hidden';   // no art: keep the names lined up
      }
    };
    var span = document.createElement('span');
    span.textContent = m;
    div.appendChild(img);
    div.appendChild(span);
    div.addEventListener('click', function() {
      inp.value = m;
      sug.style.display = 'none';
      document
        .getElementById('items-search-form')
        .requestSubmit();
    });
    return div;
  }

  function highlight(idx) {
    var items =
      sug.querySelectorAll('.suggestion-item');
    items.forEach(function(el, i) {
      el.classList.toggle(
        'suggestion-active', i === idx
      );
    });
    if (items[idx])
      items[idx].scrollIntoView({ block: 'nearest' });
  }

  inp.addEventListener('input', function() {
    render(inp.value.trim());
  });
  inp.addEventListener('focus', function() {
    if (!inp.value.trim() && allI.length > 0) {
      render('');
    }
  });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      sug.style.display = 'none';
      return;
    }
    if (sug.style.display !== 'block') return;
    var items =
      sug.querySelectorAll('.suggestion-item');
    if (items.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = (activeIdx + 1) % items.length;
      highlight(activeIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx =
        (activeIdx - 1 + items.length) % items.length;
      highlight(activeIdx);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && items[activeIdx]) {
        inp.value = items[activeIdx].textContent;
        sug.style.display = 'none';
        document
          .getElementById('items-search-form')
          .requestSubmit();
      }
    } else if (e.key === 'Escape') {
      sug.style.display = 'none';
    }
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrapper, .filter-bar')) {
      sug.style.display = 'none';
    }
  });
})();
</script>
{% endblock %}
